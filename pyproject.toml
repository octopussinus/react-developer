[project]
name = "react-developer"
version = "1.0.0"
description = "Opinionated, agent-agnostic React/Expo workflow: feature-sliced architecture, deterministic generators, and a closed verify/feedback loop for Claude Code, Codex and Gemini CLI."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "readchar>=4.1",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
react-dev = "react_dev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/react_dev"]

[tool.hatch.build.targets.wheel.shared-data]
"skills" = "share/react-developer/skills"
"templates" = "share/react-developer/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
