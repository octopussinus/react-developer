[project]
name = "react-developer"
version = "1.1.0"
description = "Opinionated, agent-agnostic React/Expo workflow: feature-sliced architecture, deterministic generators, and a closed verify/feedback loop for Claude Code, Codex and Gemini CLI."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "readchar>=4.1",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
react-dev = "react_dev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# shared-data force-includes directories, which bypasses VCS ignore rules --
# without these, templates/react/node_modules (468 MB) lands in the wheel.
# Visual baselines under e2e/*-snapshots ARE wanted and must not be excluded.
exclude = [
  "**/node_modules",
  "**/dist",
  "**/coverage",
  "**/playwright-report",
  "**/test-results",
  "**/storybook-static",
  "**/.expo",
  # Generated by Metro / `npm run typecheck` in the react-native template.
  "**/uniwind-types.d.ts",
  "**/__pycache__",
  "**/.pytest_cache",
  "**/.venv",
  "registry/public",
]

[tool.hatch.build.targets.wheel]
packages = ["src/react_dev"]

[tool.hatch.build.targets.wheel.shared-data]
"skills" = "share/react-developer/skills"
"templates" = "share/react-developer/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
