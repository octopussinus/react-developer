[project]
name = "react-developer"
version = "0.0.1"
description = "React Developer CLI - A specialized toolkit for AI-assisted React development with TypeScript and Tailwind CSS."
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "httpx[socks]",
    "platformdirs",
    "readchar",
    "truststore>=0.10.4",
]

[project.scripts]
react-dev = "specify_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specify_cli"]

[tool.hatch.build.targets.wheel.shared-data]
"templates" = "share/react-developer/templates"
"react-template" = "share/react-developer/react-template"
"expo-template" = "share/react-developer/expo-template"

