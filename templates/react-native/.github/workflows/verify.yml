name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: format
        run: npm run format:check
      - name: lint
        run: npm run lint
      - name: types
        run: npm run typecheck
      - name: tests (web logic + native UI)
        run: npm run test
      - name: still opens in Expo Go
        run: npm run expo-go:check
      - name: expo-doctor
        run: npm run doctor
      # Bundling both platforms proves every screen compiles for iOS and
      # Android -- on Linux, with no simulator.
      - name: bundles
        run: npm run bundle
