name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static gates: fast, and they catch most AI-generated defects.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: format
        run: npm run format:check
      - name: lint
        run: npm run lint
      - name: types
        run: npm run typecheck
      - name: unit tests
        run: npm run test
      - name: dead code
        run: npm run deadcode
      - name: duplicate code
        run: npm run duplicates
      - name: locale parity
        run: npm run i18n:check

  # Behavioural gates: slower, so they run only once static is green.
  e2e:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: end-to-end
        run: npm run e2e
      - name: accessibility
        run: npm run a11y
      - name: visual regression
        run: npm run visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Tests the tests. Diff-scoped so it stays quick on a PR.
  mutation:
    runs-on: ubuntu-latest
    needs: static
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: mutation testing on the diff
        run: npm run test:mutation
