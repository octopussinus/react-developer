name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -q

  # The template must pass the gate it ships. Without this, the CLI can hand out
  # a project that fails `npm run verify` on step one -- which has happened.
  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: templates/react/package-lock.json
      - run: npm install
      - run: npm run verify
      - run: npm run build

  # The generator must produce code that passes the same gate.
  generated:
    runs-on: ubuntu-latest
    needs: template
    defaults:
      run:
        working-directory: templates/react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: templates/react/package-lock.json
      - run: npm install
      - run: npm run gen -- feature orders --route=/orders
      - run: npm run gen -- component orders OrderCard
      - run: npm run gen -- hook orders useOrderFilters
      - run: npm run verify
      - run: npm run build
